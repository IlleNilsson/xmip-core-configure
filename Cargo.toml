[package]
name = "xmip-core-configure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-configure"
description = "Xmip configuration documents — a node's configuration and the Xmip Applications it binds — and the configured service they describe."

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
# The same family as toml, keeping what it does not touch: a Subscription's
# entry read as the file writes it, with its own layout and comments
# (`entry`; ADR-0013, amendment 2026-09-30).
toml_edit = { version = "0.25.19", features = ["serde"] }
abi = { workspace = true }
# A Subscription, its filter and where it routes are route's, read here from
# an Xmip Application and never modelled again (ADR-0064).
route = { workspace = true }
# A Location's settings are read through the declaration its technology
# makes of them (xcore::settings, ADR-0064 amendment 2026-09-26): the shape is
# xmip-core's, the declarations the caller's.
xcore = { workspace = true }
# The weakest verdict a Receive Location takes, read in `Verified`'s words.
context = { workspace = true }
# A Location's address as a URI writes it (net::Target), read once for the
# estate: its scheme chooses the transport (ADR-0064, amendment 2026-10-28).
net = { workspace = true }
# The stages a compiled unit serves are the message path's, read by node's
# Stage and never listed again (ADR-0066, amendment 2026-10-22).
node = { workspace = true }
# Where a cluster's file places its work: the one match of a requirement
# against what each node declares, and its refusal (`xcluster::place`,
# `every`; ADR-0056, amendment 2026-11-13). The pure part only, which opens
# nothing (ADR-0058, amendment 2026-11-13).
xcluster = { workspace = true, default-features = false }
# The standard module, built in (configure::standard): each capability's
# units' declarations, read without their code, which stays behind each
# crate's default feature `units`.
prepare = { workspace = true, default-features = false }
transform = { workspace = true, default-features = false }
promote = { workspace = true, default-features = false }
demote = { workspace = true, default-features = false }
contract = { workspace = true }
process = { workspace = true }

[features]
# The test cluster every Rust test takes its cluster's and nodes' names from
# (`fixture`, the Reference Environment), placed once in the lowest layer that
# reads a cluster's file. Never in a production build.
test-support = []
